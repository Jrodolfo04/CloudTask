<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.2</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --accent-soft: #f3f4f6;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 880px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
      overflow: hidden;
    }

    .header {
      padding: 32px 32px 24px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .header p {
      color: var(--muted);
      font-size: 15px;
    }

    .version {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .content {
      padding: 28px 32px 32px;
    }

    .input-group {
      display: grid;
      grid-template-columns: 1fr 150px 160px 110px;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"],
    input[type="date"],
    select {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(17,24,39,.08);
    }

    button {
      cursor: pointer;
      transition: background .15s, color .15s, transform .05s;
    }

    button:active {
      transform: scale(0.97);
    }

    #addTaskBtn {
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 600;
      padding: 12px;
    }

    #addTaskBtn:hover {
      background: #000;
    }

    .control-panel {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 20px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }

    .filter-btn:hover {
      background: var(--accent-soft);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .clear-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }

    .clear-btn:hover {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
    }

    .task-list {
      list-style: none;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: border-color .15s;
    }

    .task:hover {
      border-color: #d1d5db;
    }

    .task.overdue {
      border-left: 4px solid var(--danger);
    }

    .task-left {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-text {
      font-size: 15px;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
    }

    .priority,
    .date-badge,
    .overdue-badge {
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .priority-baja {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .priority-media {
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .priority-alta {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .date-badge {
      background: var(--accent-soft);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .overdue-badge {
      background: var(--danger);
      color: white;
      border: 1px solid var(--danger);
    }

    .actions {
      display: flex;
      gap: 4px;
    }

    .edit-btn,
    .delete-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .edit-btn:hover {
      background: var(--accent-soft);
      color: var(--text);
    }

    .delete-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .summary {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .summary-card {
      background: var(--accent-soft);
      color: var(--muted);
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .summary-card strong {
      display: block;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 25px;
      font-size: 14px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    footer .author {
      color: var(--text);
      font-weight: 600;
    }

    @media(max-width:800px) {
      body {
        padding: 16px;
      }

      .header,
      .content {
        padding-left: 20px;
        padding-right: 20px;
      }

      .input-group,
      .control-panel,
      .summary {
        grid-template-columns: 1fr;
      }

      .task {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>☁ CloudTask</h1>
    <p>Gestor de tareas interactivo</p>
    <span class="version">Versión 1.2</span>
  </div>

  <div class="content">

    <div class="input-group">

      <input
        id="taskInput"
        type="text"
        placeholder="Escribe una nueva tarea..."
      >

      <select id="prioritySelect">
        <option value="baja">Prioridad baja</option>
        <option value="media" selected>Prioridad media</option>
        <option value="alta">Prioridad alta</option>
      </select>

      <input id="dueDateInput" type="date">

      <button id="addTaskBtn">
        Agregar
      </button>

    </div>

    <div class="control-panel">

      <input
        id="searchInput"
        type="text"
        placeholder="Buscar tareas..."
      >

      <select id="sortSelect">
        <option value="default">Orden original</option>
        <option value="priority">Por prioridad</option>
        <option value="date">Por fecha límite</option>
      </select>

    </div>

    <div class="toolbar">

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendientes</button>
        <button class="filter-btn" data-filter="completed">Completadas</button>
      </div>

      <button id="clearCompletedBtn" class="clear-btn">
        Eliminar completadas
      </button>

    </div>

    <ul id="taskList" class="task-list"></ul>

    <div class="summary">

      <div class="summary-card">
        Total
        <strong id="totalCount">0</strong>
      </div>

      <div class="summary-card">
        Pendientes
        <strong id="pendingCount">0</strong>
      </div>

      <div class="summary-card">
        Vencidas
        <strong id="overdueCount">0</strong>
      </div>

    </div>

  </div>

  <footer>
    CloudTask v1.2 · GitHub + Vercel<br>
    Desarrollado por: <span class="author">JOSE RODOLFO ZAMBRANO CASTRO</span>
  </footer>

</div>

<script>
  const taskInput = document.getElementById("taskInput");
  const prioritySelect =
    document.getElementById("prioritySelect");
  const dueDateInput =
    document.getElementById("dueDateInput");
  const addTaskBtn =
    document.getElementById("addTaskBtn");

  const taskList =
    document.getElementById("taskList");

  const totalCount =
    document.getElementById("totalCount");
  const pendingCount =
    document.getElementById("pendingCount");
  const overdueCount =
    document.getElementById("overdueCount");

  const filterButtons =
    document.querySelectorAll(".filter-btn");

  const clearCompletedBtn =
    document.getElementById("clearCompletedBtn");

  const searchInput =
    document.getElementById("searchInput");

  const sortSelect =
    document.getElementById("sortSelect");

  let currentFilter = "all";
  let editingId = null;

  let tasks =
    JSON.parse(localStorage.getItem("cloudTaskTasks"));

  if (!tasks) {
    tasks = [
      {
        id: 1,
        text: "Subir proyecto a GitHub",
        completed: false,
        priority: "alta",
        dueDate: ""
      },
      {
        id: 2,
        text: "Desplegar aplicación en Vercel",
        completed: false,
        priority: "media",
        dueDate: ""
      },
      {
        id: 3,
        text: "Probar aplicación desde el teléfono",
        completed: true,
        priority: "baja",
        dueDate: ""
      }
    ];
  }

  function saveTasks() {
    localStorage.setItem(
      "cloudTaskTasks",
      JSON.stringify(tasks)
    );
  }

  function isOverdue(task) {
    if (!task.dueDate || task.completed) {
      return false;
    }

    const today = new Date();
    today.setHours(0,0,0,0);

    const due =
      new Date(task.dueDate + "T00:00:00");

    return due < today;
  }

  function renderTasks() {
    taskList.innerHTML = "";

    let visibleTasks = [...tasks];

    if (currentFilter === "pending") {
      visibleTasks =
        visibleTasks.filter(task => !task.completed);
    }

    if (currentFilter === "completed") {
      visibleTasks =
        visibleTasks.filter(task => task.completed);
    }

    const searchText =
      searchInput.value.toLowerCase().trim();

    if (searchText) {
      visibleTasks =
        visibleTasks.filter(task =>
          task.text.toLowerCase().includes(searchText)
        );
    }

    if (sortSelect.value === "priority") {
      const order = {
        alta: 1,
        media: 2,
        baja: 3
      };

      visibleTasks.sort(
        (a,b) =>
          order[a.priority] - order[b.priority]
      );
    }

    if (sortSelect.value === "date") {
      visibleTasks.sort((a,b) => {
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;

        return (
          new Date(a.dueDate) -
          new Date(b.dueDate)
        );
      });
    }

    if (visibleTasks.length === 0) {
      taskList.innerHTML =
        '<li class="empty">No hay tareas para mostrar</li>';
    }

    visibleTasks.forEach(task => {
      const li = document.createElement("li");

      li.className = "task";

      if (task.completed) {
        li.classList.add("completed");
      }

      if (isOverdue(task)) {
        li.classList.add("overdue");
      }

      const priorityText = {
        baja: "Baja",
        media: "Media",
        alta: "Alta"
      };

      const dateHtml = task.dueDate
        ? `<span class="date-badge">
             Fecha: ${task.dueDate}
           </span>`
        : "";

      const overdueHtml = isOverdue(task)
        ? `<span class="overdue-badge">
             Vencida
           </span>`
        : "";

      li.innerHTML = `

        <div class="task-left">

          <input
            type="checkbox"
            ${task.completed ? "checked" : ""}
            onchange="toggleTask(${task.id})"
          >

          <div class="task-info">

            <span class="task-text">
              ${task.text}
            </span>

            <div class="meta">

              <span class="priority priority-${task.priority}">
                Prioridad ${priorityText[task.priority]}
              </span>

              ${dateHtml}

              ${overdueHtml}

            </div>

          </div>

        </div>

        <div class="actions">

          <button
            class="edit-btn"
            onclick="editTask(${task.id})"
          >
            Editar
          </button>

          <button
            class="delete-btn"
            onclick="deleteTask(${task.id})"
          >
            Eliminar
          </button>

        </div>
      `;

      taskList.appendChild(li);
    });

    updateCounters();
    saveTasks();
  }

  function addOrUpdateTask() {
    const text = taskInput.value.trim();

    if (!text) {
      alert("Escribe una tarea.");
      return;
    }

    const priority =
      prioritySelect.value;

    const dueDate =
      dueDateInput.value;

    if (editingId !== null) {
      tasks = tasks.map(task =>
        task.id === editingId
          ? {
              ...task,
              text,
              priority,
              dueDate
            }
          : task
      );

      editingId = null;
      addTaskBtn.textContent = "Agregar";

    } else {
      tasks.push({
        id: Date.now(),
        text,
        completed: false,
        priority,
        dueDate
      });
    }

    taskInput.value = "";
    prioritySelect.value = "media";
    dueDateInput.value = "";

    renderTasks();
  }

  function editTask(id) {
    const task =
      tasks.find(task => task.id === id);

    if (!task) return;

    taskInput.value = task.text;
    prioritySelect.value = task.priority;
    dueDateInput.value = task.dueDate || "";

    editingId = id;

    addTaskBtn.textContent = "Guardar";
    taskInput.focus();
  }

  function toggleTask(id) {
    tasks = tasks.map(task =>
      task.id === id
        ? {
            ...task,
            completed: !task.completed
          }
        : task
    );

    renderTasks();
  }

  function deleteTask(id) {
    tasks =
      tasks.filter(task => task.id !== id);

    renderTasks();
  }

  function clearCompletedTasks() {
    if (
      confirm(
        "¿Eliminar todas las tareas completadas?"
      )
    ) {
      tasks =
        tasks.filter(task => !task.completed);

      renderTasks();
    }
  }

  function updateCounters() {
    totalCount.textContent =
      tasks.length;

    pendingCount.textContent =
      tasks.filter(
        task => !task.completed
      ).length;

    overdueCount.textContent =
      tasks.filter(isOverdue).length;
  }

  addTaskBtn.addEventListener(
    "click",
    addOrUpdateTask
  );

  taskInput.addEventListener(
    "keypress",
    event => {
      if (event.key === "Enter") {
        addOrUpdateTask();
      }
    }
  );

  clearCompletedBtn.addEventListener(
    "click",
    clearCompletedTasks
  );

  searchInput.addEventListener(
    "input",
    renderTasks
  );

  sortSelect.addEventListener(
    "change",
    renderTasks
  );

  filterButtons.forEach(button => {
    button.addEventListener(
      "click",
      function() {
        filterButtons.forEach(btn =>
          btn.classList.remove("active")
        );

        this.classList.add("active");
        currentFilter = this.dataset.filter;

        renderTasks();
      }
    );
  });

  renderTasks();
</script>

</body>
</html>
